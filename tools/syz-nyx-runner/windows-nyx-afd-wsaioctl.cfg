{
	"name": "windows-nyx-afd-wsaioctl",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx-afd-wsaioctl",
	"syzkaller": ".",
	"type": "nyx",
	"reproduce": true,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 5,
		"windows_target_profile": "afd",
		"force_generate_every_n": 1,
		"seed_prefix": "nyx_afd_wsaioctl_lowrisk"
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-afd-wsaioctl",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": false,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"keep_state": false,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
	"enable_syscalls": [
		"bind$inet_udp",
		"WSAIoctl$sio_get_interface_list",
		"WSAIoctl$sio_udp_connreset"
	],
	"disable_syscalls": [
		"socket$connected_udp",
		"recv$inet_udp",
		"recvfrom$udp_bound",
		"recvfrom$udp_connected",
		"WSARecvFrom$udp",
		"WSARecvMsg$udp",
		"connect$inet_tcp",
		"accept$inet_tcp",
		"socket$accept_tcp",
		"ConnectEx$inet_tcp*",
		"DisconnectEx$inet_tcp*",
		"AcceptEx$inet_tcp*",
		"CreateIoCompletionPort$*",
		"WSAGetOverlappedResult$*",
		"CancelIoEx$*",
		"CancelIo$*",
		"NtDeviceIoControlFile$afd_event_select_accept",
		"NtDeviceIoControlFile$afd_enum_network_events_accept",
		"NtDeviceIoControlFile$afd_poll_accept"
	]
}
