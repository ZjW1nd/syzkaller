{
  "name": "windows-nyx-afd-rio",
  "target": "windows/amd64",
  "http": "127.0.0.1:56741",
  "rpc": "127.0.0.1:56555",
  "workdir": "/tmp/syz-nyx-afd-rio",
  "syzkaller": ".",
  "type": "nyx",
  "reproduce": true,
  "sandbox": "none",
  "cover": true,
  "procs": 1,
  "executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
  "experimental": {
    "cover_edges": true,
    "disable_collide": true,
    "max_calls_per_prog": 8,
    "windows_target_profile": "afd",
    "seed_prefix": "nyx_exp_afd_rio_"
  },
  "vm": {
    "count": 1,
    "runner": "./bin/syz-nyx-runner",
    "qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
    "workdir": "/dev/shm/nyx-afd-rio",
    "image": "../guest-vm/runtime/fullchain.qcow2",
    "memory": 4096,
    "payload_size": 131072,
    "module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
    "debug": true,
    "windows_minidump": true,
    "windows_minidump_timeout": 120,
    "keep_state": false,
    "qemu_args": [
      "-enable-kvm",
      "-machine",
      "kAFL64-v1",
      "-cpu",
      "kAFL64-Hypervisor-v1,+vmx",
      "-smp",
      "1",
      "-no-reboot",
      "-drive",
      "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
      "-drive",
      "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
      "-net",
      "none",
      "-display",
      "none"
    ]
  },
  "enable_syscalls": [
    "NtCreateFile$afd_rio_registration_domain",
    "NtCreateFile$afd_rio_tcp_endpoint",
    "NtDeviceIoControlFile$afd_rio_create_cq",
    "NtDeviceIoControlFile$afd_rio_notify_cq",
    "NtDeviceIoControlFile$afd_rio_register_buffer",
    "NtDeviceIoControlFile$afd_rio_resize_cq",
    "NtDeviceIoControlFile$afd_rio_destroy_cq",
    "NtDeviceIoControlFile$afd_rio_deregister_buffer",
    "NtDeviceIoControlFile$afd_rio_create_rqpair",
    "NtDeviceIoControlFile$afd_rio_flush_send",
    "NtDeviceIoControlFile$afd_rio_flush_receive",
    "NtDeviceIoControlFile$afd_rio_resize_rqpair"
  ]
}
