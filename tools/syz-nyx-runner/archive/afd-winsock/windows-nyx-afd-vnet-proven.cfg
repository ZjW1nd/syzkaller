{
	"name": "windows-nyx-afd-vnet-proven",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx-afd-vnet-proven",
	"syzkaller": ".",
	"type": "nyx",
	"reproduce": true,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 8,
		"force_generate_every_n": 2,
		"windows_target_profile": "afd",
		"seed_prefix": "nyx_afd_accept_vnet_recv,nyx_afd_accept_vnet_wsarecv,nyx_afd_acceptex_vnet_",
		"borrowing_seed_prefix": "nyx_afd_accept_vnet_recv,nyx_afd_accept_vnet_wsarecv,nyx_afd_acceptex_vnet_"
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-afd-vnet-proven",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": true,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
	"enable_syscalls": [
		"recv$inet_accept",
		"ioctlsocket$fionbio_accept",
		"WSARecv$accept",
		"WSARecv$accept_pending",
		"AcceptEx$inet_tcp_pending",
		"CreateIoCompletionPort$socket",
		"CreateIoCompletionPort$accept_pending",
		"WSAGetOverlappedResult$accept_pending",
		"WSAGetOverlappedResult$accept_recv_pending",
		"GetQueuedCompletionStatus$socket",
		"GetAcceptExSockaddrs$inet_tcp",
		"setsockopt$update_accept_context",
		"recv$inet_accept_updated",
		"CancelIoEx$accept_pending",
		"CancelIo$accept_pending",
		"closesocket$accept_pending"
	]
}
