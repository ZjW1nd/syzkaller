{
	"name": "windows-nyx-afd-disconnectex-reuse",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx-afd-disconnectex-reuse",
	"syzkaller": ".",
	"type": "nyx",
	"reproduce": true,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 22,
		"windows_target_profile": "afd",
		"seed_prefix": "nyx_exp_afd_disconnectex_reuse",
		"borrowing_seed_prefix": "",
		"disable_collide": true,
		"no_generate_syscalls": [
			"connect$inet_tcp",
			"accept$inet_tcp"
		],
		"corpus_fuzz_weight_rules": [
			{
				"calls": [
					"connect$inet_tcp"
				],
				"weight": 0
			}
		]
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-afd-disconnectex-reuse",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": true,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"keep_state": false,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
	"enable_syscalls": [
		"bind$inet_tcp",
		"listen$inet_tcp",
		"bind$connectex_tcp",
		"connect$inet_tcp",
		"accept$inet_tcp",
		"closesocket$any",
		"ConnectEx$inet_tcp_pending",
		"DisconnectEx$inet_tcp_reuse",
		"CreateIoCompletionPort$disconnect_reuse_pending",
		"WSAGetOverlappedResult$disconnect_reuse_pending",
		"ConnectEx$inet_tcp_reuse",
		"CreateIoCompletionPort$connect_pending",
		"WSAGetOverlappedResult$connect_pending",
		"GetQueuedCompletionStatus$socket",
		"setsockopt$update_connect_context"
	],
	"disable_syscalls": [
		"socket$accept_tcp",
		"socket$connected_tcp",
		"ioctlsocket$fionbio_listener",
		"ioctlsocket$fionbio_tcp_created",
		"ioctlsocket$fionbio_tcp_connected",
		"connect$inet_tcp_nonblock",
		"accept$inet_tcp_nonblock",
		"send$inet_tcp",
		"recv$inet_tcp",
		"WSARecv$tcp",
		"WSASend$tcp",
		"WSARecv$tcp_pending",
		"WSASend$tcp_pending",
		"recv$inet_accept",
		"WSARecv$accept",
		"WSASend$accept",
		"WSARecv$accept_pending",
		"WSASend$accept_pending",
		"ConnectEx$inet_tcp",
		"DisconnectEx$inet_tcp",
		"AcceptEx$inet_tcp*",
		"GetAcceptExSockaddrs$inet_tcp",
		"setsockopt$update_accept_context",
		"setsockopt$int_accept_updated",
		"getsockopt$int_accept_updated",
		"CreateIoCompletionPort$socket",
		"CreateIoCompletionPort$accept*",
		"CreateIoCompletionPort$tcp_recv_pending",
		"CreateIoCompletionPort$tcp_send_pending",
		"WSAGetOverlappedResult$socket",
		"WSAGetOverlappedResult$accept*",
		"WSAGetOverlappedResult$tcp_recv_pending",
		"WSAGetOverlappedResult$tcp_send_pending",
		"CancelIoEx$*",
		"CancelIo$*",
		"closesocket$accept_pending",
		"closesocket$accept_recv_pending",
		"closesocket$accept_send_pending",
		"closesocket$connect_pending",
		"closesocket$tcp_recv_pending",
		"closesocket$tcp_send_pending",
		"WSAEventSelect$*",
		"WSAEnumNetworkEvents$*",
		"select$afd*",
		"NtDeviceIoControlFile$afd_event_select_accept*",
		"NtDeviceIoControlFile$afd_enum_network_events_accept*",
		"NtDeviceIoControlFile$afd_poll_accept*",
		"TransmitFile$inet_accept*",
		"TransmitPackets$inet_accept*",
		"CreateRemoteThreadEx",
		"AddFontMemResourceEx"
	]
}
