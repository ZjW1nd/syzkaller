{
	"name": "windows-nyx-afd-transmit",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx-afd-transmit",
	"syzkaller": ".",
	"type": "nyx",
	"reproduce": true,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"disable_collide": true,
		"max_calls_per_prog": 8,
		"windows_target_profile": "afd",
		"seed_prefix": "nyx_exp_afd_transmit_nonblock"
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-afd-transmit",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": true,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
	"enable_syscalls": [
		"NtCreateFile$afd_tcp_endpoint",
		"NtDeviceIoControlFile$afd_bind_tcp",
		"NtDeviceIoControlFile$afd_start_listen_tcp",
		"NtDeviceIoControlFile$afd_connect_tcp_to_listener",
		"NtDeviceIoControlFile$afd_wait_for_listen_tcp",
		"NtDeviceIoControlFile$afd_accept_tcp",
		"NtDeviceIoControlFile$afd_set_information_nonblock_tcp_accepted",
		"WriteFile$afd_transmit",
		"NtDeviceIoControlFile$afd_transmit_file_accept_nonblock",
		"NtDeviceIoControlFile$afd_transmit_packets_accept_nonblock"
	],
	"disable_syscalls": [
		"WSAStartup",
		"WSACleanup",
		"socket$inet_*",
		"bind$inet_*",
		"listen$inet_tcp",
		"connect$inet_tcp*",
		"accept$inet_tcp*",
		"ioctlsocket$fionbio_*",
		"socket$accept_tcp",
		"socket$connected_tcp",
		"AcceptEx$inet_tcp*",
		"ConnectEx$inet_tcp*",
		"DisconnectEx$inet_tcp*",
		"CreateIoCompletionPort$*",
		"GetQueuedCompletionStatus$socket",
		"WSAGetOverlappedResult$*",
		"CancelIoEx$*",
		"CancelIo$*",
		"closesocket$*",
		"CreatePipe$anon",
		"AddFontMemResourceEx",
		"TransmitFile$inet_accept*",
		"TransmitPackets$inet_accept*"
	]
}
