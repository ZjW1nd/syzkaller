{
	"name": "windows-nyx",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx",
	"syzkaller": ".",
	"type": "none",
	"reproduce": false,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 6
	},
	"no_mutate_syscalls": [
		"VirtualAlloc",
		"CreateFileA",
		"CreateFile2",
		"CloseHandle"
	],
	"enable_syscalls": [
		"VirtualAlloc",
		"NtQuerySystemInformation",
		"NtQueryInformationProcess",
		"NtSetInformationProcess",
		"NtDelayExecution",
		"NtYieldExecution",
		"NtQueryTimerResolution",
		"NtSetTimerResolution",
		"NtQuerySystemTime",
		"NtQueryPerformanceCounter",
		"NtPowerInformation",
		"NtFlushInstructionCache",
		"NtFlushWriteBuffer",
		"NtQueryDefaultLocale",
		"NtQueryDefaultUILanguage",
		"NtFsControlFile",
		"NtReadFile",
		"NtWriteFile",
		"CloseHandle",
		"CreateFileA",
		"CreateFile2",
		"ReadFile",
		"WriteFile",
		"FlushFileBuffers",
		"SetFileInformationByHandle",
		"DeleteFileA"
	]
}
