{
	"name": "windows-nyx-afd-private",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx-afd-private",
	"syzkaller": ".",
	"type": "nyx",
	"reproduce": true,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 6,
		"windows_target_profile": "afd",
		"force_generate_every_n": 2,
		"seed_prefix": "nyx_afd_private_query_",
		"borrowing_seed_prefix": "nyx_afd_private_query_"
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-afd-private",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": false,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"keep_state": true,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
	"enable_syscalls": [
		"NtDeviceIoControlFile$afd_query_recv_tcp",
		"NtDeviceIoControlFile$afd_query_recv_accept",
		"NtDeviceIoControlFile$afd_get_remote_address_tcp",
		"NtDeviceIoControlFile$afd_get_context_tcp",
		"NtDeviceIoControlFile$afd_address_list_query_udp",
		"NtDeviceIoControlFile$afd_routing_interface_query_udp"
	]
}
