{
	"name": "windows-nyx",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx",
	"syzkaller": ".",
	"type": "nyx",
	"reproduce": true,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 6
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-fullchain",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": true,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
	"enable_syscalls": [
		"NtQuerySystemInformation",
		"NtQueryInformationProcess",
		"NtSetInformationProcess",
		"NtDelayExecution",
		"NtYieldExecution",
		"NtQueryTimerResolution",
		"NtSetTimerResolution",
		"NtQuerySystemTime",
		"NtQueryPerformanceCounter",
		"NtPowerInformation",
		"NtFlushInstructionCache",
		"NtFlushWriteBuffer",
		"NtQueryDefaultLocale",
		"NtQueryDefaultUILanguage",
		"NtFsControlFile",
		"NtFsControlFile$ntfs_get_compression",
		"NtFsControlFile$ntfs_set_compression",
		"NtFsControlFile$ntfs_set_sparse",
		"NtFsControlFile$ntfs_set_zero_data",
		"NtFsControlFile$ntfs_query_allocated_ranges",
		"NtQueryInformationFile$basic",
		"NtQueryInformationFile$standard",
		"NtQueryInformationFile$network_open",
		"NtReadFile",
		"NtSetInformationFile$basic",
		"NtWriteFile",
		"FlushFileBuffers",
		"SetFileInformationByHandle",
		"DeleteFileA"
	]
}
