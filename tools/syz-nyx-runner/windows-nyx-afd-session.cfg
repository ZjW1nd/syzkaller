	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 6,
		"windows_target_profile": "afd",
		"force_generate_every_n": 2,
		"seed_prefix": "nyx_afd_",
