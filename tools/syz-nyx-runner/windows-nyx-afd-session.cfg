{
	"name": "windows-nyx-afd-session",
	"target": "windows/amd64",
	"http": "127.0.0.1:56741",
	"rpc": "127.0.0.1:56555",
	"workdir": "/tmp/syz-nyx-afd-session",
	"syzkaller": ".",
	"type": "nyx",
	"reproduce": true,
	"sandbox": "none",
	"cover": true,
	"procs": 1,
	"executor_bin_on_target": "C:\\syzkaller\\syz-executor.exe",
	"experimental": {
		"cover_edges": true,
		"max_calls_per_prog": 6,
		"windows_target_profile": "afd",
		"seed_prefix": "nyx_afd_",
		"borrowing_seed_prefix": "nyx_afd_"
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-afd-session",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": true,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
	"enable_syscalls": [
		"send$inet_tcp",
		"recv$inet_tcp",
		"send$inet_accept",
		"recv$inet_accept",
		"send$inet_udp",
		"recv$inet_udp",
		"WSASend$tcp",
		"WSASend$accept",
		"WSARecv$tcp",
		"WSARecv$accept",
		"sendto$udp_bound",
		"sendto$udp_connected",
		"recvfrom$udp_bound",
		"recvfrom$udp_connected",
		"WSASendTo$udp",
		"WSARecvFrom$udp",
		"shutdown$tcp",
		"shutdown$accept",
		"shutdown$tcp_rd",
		"shutdown$tcp_wr",
		"shutdown$accept_rd",
		"shutdown$accept_wr",
		"getsockname$tcp",
		"getsockname$udp",
		"getsockname$accept",
		"getpeername$tcp",
		"getpeername$udp",
		"getpeername$accept",
		"select$afd_basic",
		"WSAEventSelect$tcp",
		"WSAEventSelect$accept",
		"WSAEnumNetworkEvents$tcp",
		"WSAEnumNetworkEvents$accept",
		"WSAIoctl$sio_address_list_query",
		"WSAIoctl$sio_routing_interface_query",
		"WSAIoctl$sio_keepalive_vals",
		"WSAIoctl$sio_get_extension_function_pointer",
		"ConnectEx$inet_tcp",
		"DisconnectEx$inet_tcp",
		"DisconnectEx$inet_tcp_reuse",
		"ConnectEx$inet_tcp_reuse",
		"GetAcceptExSockaddrs$inet_tcp",
		"TransmitPackets$inet_accept",
		"WSARecvMsg$udp",
		"ioctlsocket$fionbio_tcp",
		"ioctlsocket$fionbio_udp",
		"ioctlsocket$fionbio_accept",
		"setsockopt$int_tcp",
		"setsockopt$int_udp",
		"setsockopt$int_accept",
		"getsockopt$int_tcp",
		"getsockopt$int_udp",
		"getsockopt$int_accept",
		"WSARecvEx$inet_accept"
	]
}
