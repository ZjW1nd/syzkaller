				"weight": 0
			},
			{
				"calls": [
					"select$afd_accept_nonblock",
					"WSAEventSelect$tcp_nonblock",
					"WSAEnumNetworkEvents$tcp_nonblock",
					"NtDeviceIoControlFile$afd_event_select_accept_nonblock",
					"NtDeviceIoControlFile$afd_enum_network_events_accept_nonblock",
					"NtDeviceIoControlFile$afd_poll_accept_nonblock",
					"NtDeviceIoControlFile$afd_query_handles_accept",
					"NtDeviceIoControlFile$afd_get_qos_accept",
					"NtDeviceIoControlFile$afd_noop_accept"
				],
				"weight": 0
			},
			{
				"calls": [
					"WSARecvEx$inet_accept_nonblock"
				],
				"weight": 0
			},
			{
				"calls": [
					"TransmitPackets$inet_accept_nonblock",
					"TransmitFile$inet_accept_nonblock",
					"WriteFile$afd_transmit"
				],
				"weight": 0
			}
		]
	},
	"vm": {
		"count": 1,
		"runner": "./bin/syz-nyx-runner",
		"qemu": "../my-qemu-nyx/x86_64-softmmu/qemu-system-x86_64",
		"workdir": "/dev/shm/nyx-afd-session",
		"image": "../guest-vm/runtime/fullchain.qcow2",
		"memory": 4096,
		"payload_size": 131072,
		"module_ranges": "ntoskrnl.exe:required,ntfs.sys,afd.sys,win32k*.sys",
		"debug": false,
		"windows_minidump": true,
		"windows_minidump_timeout": 120,
		"keep_state": false,
		"qemu_args": [
			"-enable-kvm",
			"-machine", "kAFL64-v1",
			"-cpu", "kAFL64-Hypervisor-v1,+vmx",
			"-smp", "1",
			"-no-reboot",
			"-drive", "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd",
			"-drive", "if=pflash,format=raw,file={{NYX_WORKDIR}}/OVMF_VARS.fd",
			"-net", "none",
			"-display", "none"
		]
	},
